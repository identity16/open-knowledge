name: identity16 Upstream Sync
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: identity16-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'identity16/open-knowledge'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/fork
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Test synchronization decisions
        run: node --test scripts/fork/sync-upstream.test.mjs
      - name: Open or update upstream PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fork/sync-upstream.mjs "$GITHUB_STEP_SUMMARY"
