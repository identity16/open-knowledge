name: OpenKnowledge16 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New fork version, for example 0.76.0-identity16.4'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fork-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'identity16/open-knowledge' && github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      FORK_VERSION: ${{ inputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
      - name: Install build tools
        run: |
          npm install --global pnpm@12.8.1
          rustup toolchain install --no-self-update
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release version
        run: pnpm exec node --input-type=module -e 'import { forkReleasePlan } from "./scripts/fork/release-plan.mjs"; console.log(forkReleasePlan(process.env.FORK_VERSION).tag)'
      - name: Test update and publication contracts
        run: |
          pnpm exec node --test scripts/fork/channel.test.mjs
          pnpm exec vitest run --config vitest.scripts.config.ts scripts/fork/release-plan.test.mjs scripts/fork/publish-release.test.mjs .github/scripts/release-signing-environment-shape.test.mjs .github/scripts/fork-release-shape.test.mjs --maxWorkers=2
      - name: Build web GUI and CLI
        run: pnpm exec node scripts/fork/build-release.mjs "$FORK_VERSION"
      - name: Test fork product boundaries
        run: |
          pnpm --dir packages/core exec vitest run src/constants/product.test.ts src/constants/path-shim-layout.test.ts --maxWorkers=2
          pnpm --dir packages/cli exec vitest run src/commands/desktop-dispatch.test.ts src/commands/identity16-mcp-launcher.test.ts src/commands/stop.test.ts --maxWorkers=2
          pnpm --dir packages/desktop exec vitest run src/shared/desktop-variant.test.ts src/shared/release-links.test.ts tests/unit/desktop-variant-config.test.ts tests/unit/auto-updater-apply-channel.test.ts --maxWorkers=2
      - name: Build and verify signed desktop installers
        id: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec node scripts/fork/build-desktop.mjs "$FORK_VERSION"
      - name: Publish complete fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec node scripts/fork/publish-release.mjs "$FORK_VERSION"
