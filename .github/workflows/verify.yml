name: Verify
on:
  push:
    branches: [main]
cache-mode: none
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  TURBO_TELEMETRY_DISABLED: '1'
jobs:
  changed:
    runs-on: [self-hosted, ok-macmini-verify]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          clean: false
      - name: Remove earlier run files except installed dependencies and turbo outputs
        run: git clean -ffdx -e node_modules -e .turbo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.8.1
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          node scripts/create-turbo-cache-key.mjs
      - name: Build core for packages that run its dist
        run: pnpm --dir packages/core run build
      - name: Find the last successful main verification
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERIFICATION_BASE_SHA=$(node scripts/release/verification.mjs base "$GITHUB_SHA")
          echo "base_sha=$VERIFICATION_BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Lint, typecheck and test the accumulated changes
        env:
          VERIFICATION_BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: pnpm verify:changed "$VERIFICATION_BASE_SHA" "$RUNNER_TEMP/verification/receipt.json"
      - name: Preserve verification completion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification/receipt.json
          if-no-files-found: error
