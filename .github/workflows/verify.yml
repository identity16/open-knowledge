name: Verify
on:
  push:
    branches: [main]
cache-mode: none
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'
  TURBO_TELEMETRY_DISABLED: '1'
jobs:
  changed:
    runs-on: [self-hosted, ok-macmini]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.8.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build core for packages that run its dist
        run: pnpm --dir packages/core run build
      - name: Lint, typecheck and test what this push changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm verify:changed "$BEFORE"
          else
            pnpm verify:changed HEAD~1
          fi
